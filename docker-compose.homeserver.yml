# Deploy dietro un reverse proxy (make deploy): niente porte esposte, il container sta sulla
# rete esterna nginx-net, dove il proxy (es. Nginx Proxy Manager) lo pubblica col suo nome.
services:
  manzolo-rush:
    build: .
    image: manzolo-rush:latest
    container_name: manzolo-rush
    restart: unless-stopped
    networks:
      - nginx-net

networks:
  nginx-net:
    external: true
